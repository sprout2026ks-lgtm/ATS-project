<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="sproutTitle sproutDesc">
  <title id="sproutTitle">Sprout logo</title>
  <desc id="sproutDesc">A cyan wordmark reading sprout with a warm sunrise accent and the tagline brighter tomorrow.</desc>
  <defs>
    <linearGradient id="sproutFill" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#2ec9f7"/>
      <stop offset="100%" stop-color="#1fb4eb"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 0)">
    <text x="0" y="170"
      font-size="180"
      font-weight="800"
      letter-spacing="-10"
      font-family="Segoe UI, Arial, sans-serif"
      fill="url(#sproutFill)">sprout</text>

    <g transform="translate(610 26)">
      <circle cx="0" cy="0" r="28" fill="#f9a63d"/>
      <circle cx="0" cy="0" r="12" fill="#ffd68e" opacity="0.85"/>
      <g stroke="#f9a63d" stroke-width="6" stroke-linecap="round" opacity="0.9">
        <line x1="0" y1="-50" x2="0" y2="-32"/>
        <line x1="36" y1="-36" x2="18" y2="-18"/>
        <line x1="50" y1="0" x2="32" y2="0"/>
        <line x1="36" y1="36" x2="18" y2="18"/>
        <line x1="0" y1="50" x2="0" y2="32"/>
        <line x1="-36" y1="36" x2="-18" y2="18"/>
        <line x1="-50" y1="0" x2="-32" y2="0"/>
        <line x1="-36" y1="-36" x2="-18" y2="-18"/>
      </g>
    </g>

    <g transform="translate(26 204)">
      <text
        font-size="38"
        font-weight="800"
        letter-spacing="8"
        font-family="Segoe UI, Arial, sans-serif"
        fill="#6c9bb0">BRIGHTER TOMORROW</text>
    </g>
  </g>
</svg>
